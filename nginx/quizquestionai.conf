# This file previously routed quizquestionai.com → the Next.js frontend on :3000.
# Per request, domain access is now disabled (no proxying to the frontend).

server {
    listen 80;
    server_name quizquestionai.com www.quizquestionai.com;

    # Close connection without a response (effectively blocks the domain over HTTP)
    return 444;
}

server {
    listen 443 ssl;
    server_name quizquestionai.com www.quizquestionai.com;

    ssl_certificate /etc/letsencrypt/live/quizquestionai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quizquestionai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Close connection without a response (effectively blocks the domain over HTTPS)
    return 444;
}
